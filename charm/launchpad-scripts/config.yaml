options:
  active:
    type: boolean
    description: Should the cron jobs and the celery services be active?
    default: true
  charmhub_secrets_private_key:
    type: string
    description: >
      Base64-encoded NaCl private key for decrypting Charmhub upload tokens.
    default:
  celery_workers_concurrency_launchpad_job:
    type: int
    description: |
      Number of child processes in the Celery worker pool for the launchpad_job
      queue.
    default:
  celery_workers_concurrency_launchpad_job_slow:
    type: int
    description: |
      Number of child processes in the Celery worker pool for the launchpad_job_slow
      queue.
    default:
  checkwatches_batch_query_threshold:
    type: int
    description: The batch query threshold for the checkwatches.
    default: 0
  checkwatches_credentials:
    type: string
    description: YAML-encoded dict mapping the credentials name to values.
    default: "{}"
  commitment_tracker_base_url:
    type: string
    description: Commitment Tracker base URL.
    default:
  commitment_tracker_api_key:
    type: string
    description: API key for authenticating to Commitment Tracker.
    default:
  commitment_tracker_timeout:
    type: int
    description: Timeout for Commitment Tracker requests, in seconds.
    default: 5
  enable_debian_bugs_mirroring:
    type: boolean
    description: |
      Should the Debian bug data mirroring job be enabled? The checkwatches
      script depends on the mirrored data being available locally and hence
      it may throw some errors if it is missing.
    default: false
  internal_branch_by_id_root:
    type: string
    description: |
      The URL prefix for where branches are served by URLs based on the
      branch ID. Required by UpdatePreviewDiffJob and
      GenerateIncrementalDiffJob to generate diffs for Bazaar merge
      proposals.
    default:
  language_pack_exporter_schedule:
    type: string
    description: >-
      YAML-encoded dict mapping Ubuntu release codenames (in lower case)
      to the corresponding cron schedule strings. Example:
      xenial: 30 10 * * 0
    default: "{}"
  librarian_frontend_ip_addresses:
    type: string
    description: YAML-encoded list of librarian frontend IP addresses
    default: "[]"
  logparser_max_parsed_lines:
    type: int
    default: 2000000
    description: >
      Maximum number of log lines parsed per run by the librarian Apache
      log parser.  Bounds each run's database transaction so that it commits
      well within the long-transaction kill timeout, letting a backlog drain
      incrementally across runs rather than a single unbounded run being
      killed mid-transaction.
  mirror_prober_active:
    type: boolean
    description: Should the mirror prober be enabled?
    default: false
  mirror_prober_release_mode:
    type: boolean
    description: >-
      Should the mirror prober run in the cdimage-prober-only mode with
      custom schedule and options? This is typically enabled prior to
      release and on request only. Enabling it will disable the regular
      mode, which runs both the archive and mirror probers once an hour.
      This option will work only when the 'mirror_prober_active' option
      is true.
    default: false
  oci_registry_credentials_private_key:
    type: string
    description: >
      Base64-encoded NaCl private key for decrypting OCI registry upload
      credentials.
    default:
  process_inbound_email_host:
    type: string
    description: >-
      The mail server that the `process-mail.py` script connects to for processing
      inbound email.
    default:
  process_inbound_email_password:
    type: string
    description: >-
      The credentials for the `process_inbound_email_username` on the
      `process_inbound_email_host` mail server.
    default:
  process_inbound_email_username:
    type: string
    description: >-
      The username to connect to the `process_inbound_email_host` as.
    default:
  snap_store_secrets_private_key:
    type: string
    description: >
      Base64-encoded NaCl private key for decrypting snap store upload
      tokens.
    default:
  cppa_subprojects:
    type: string
    description: |
      JSON-encoded dict mapping subproject keys (e.g. "project/series") to
      their corresponding PPA references. Required when the CPPA vulnerability
      import handler is enabled.

      Must be a single-line JSON string, or a multi-line JSON value where
      every line (including the outer closing brace) is indented by at least
      one space. Examples:

        cppa_subprojects: '{"proj/jammy": {"ppa": "owner/ppa-name", "ubuntu_series": "jammy"}, "proj/focal": {"ppa": "owner/ppa-name", "ubuntu_series": "focal"}}'

        cppa_subprojects: {
          "proj/jammy": {"ppa": "owner/ppa-name", "ubuntu_series": "jammy"},
          "proj/focal": {"ppa": "owner/ppa-name", "ubuntu_series": "focal"}
          }
    default:
