name: launchpad-librarian
display-name: launchpad-librarian
summary: Launchpad librarian
maintainer: Launchpad Developers <launchpad-dev@lists.launchpad.net>
description: |
  Launchpad is an open source suite of tools that help people and teams
  to work together on software projects.

  This charm runs a Launchpad librarian.
tags:
  # https://juju.is/docs/charm-metadata#heading--charm-store-fields
  - network
series:
  - focal
subordinate: false
requires:
  session-db:
    interface: pgsql
provides:
  loadbalancer:
    interface: http
  vhost-config:
    interface: apache-vhost-config

storage:
  data:
    type: filesystem
    location: "/srv/launchpad/librarian"
    # XXX tushar5526 2026-06-29:: Drop the optional support after the cloud
    # migration. 
    multiple:
      range: 0-1
