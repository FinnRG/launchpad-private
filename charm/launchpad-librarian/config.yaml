options:
  active:
    type: boolean
    default: true
    description: If true, enable jobs that may change the database.
  blocked_referers:
    type: string
    description: >
      '|' separated list of referrers that should be blocked. Matching
      requests receive a 403 response.
    default:
  blocked_user_agents:
    type: string
    description: >
      '|' separated list of user agents that should be blocked. Matching 
      requests receive a 403 response.
    default:
  throttled_user_agents:
    type: string
    description: >
      '|' separated list of user agents that should be throttled. Matching
      requests receive a 429 response with a Retry-After header.
    default:
  throttled_user_agent_platforms:
    type: string
    description: >
      '|' separated list of platforms that should be throttled. The platforms
      are specified within parentheses in the user agent string. This is
      combined with throttled_user_agents. When empty, throttling matches
      only on the user agent pattern. Matching requests receive a 429 response
      with a Retry-After header. This option has no effect unless
      throttled_user_agents is also set.
    default:
  throttled_retry_after:
    type: int
    description: >
      Seconds advertised in the Retry-After header of a 429 response. This
      option has no effect unless throttled_user_agents is also set.
    default: 3600
  restricted_librarian_abuse_mitigation:
    type: boolean
    description: >
      Whether to apply the abuse-mitigation rules (blocked_user_agents,
      blocked_referers, throttled_user_agents) to the restricted librarian
      vhost as well.
    default: false
  domain_librarian:
    type: string
    description: Domain name for this instance's librarian service.
    default: "launchpadlibrarian.test"
  domain_librarian_aliases:
    type: string
    default: "[]"
    description: >
      A YAML-encoded list of aliases for the librarian's primary domain.
  haproxy_server_options:
    type: string
    description: Options to add to HAProxy "server" lines.
    default: check inter 5000 rise 2 fall 5 maxconn 16
  haproxy_service_options_download:
    type: string
    description: HAProxy options for download services.
    default: |
      - mode http
      - option httplog
      - option httpchk HEAD / HTTP/1.0
      - option forwardfor
      - balance leastconn
  haproxy_service_options_upload:
    type: string
    description: HAProxy options for upload services.
    default: |
      - mode tcp
      - option tcplog
      - option httpchk HEAD / HTTP/1.0
      - option forwardfor
      - balance leastconn
      - timeout client 600000
      - timeout server 600000
  old_os_auth_url:
    type: string
    description: >
      OpenStack authentication URL for a previous Swift instance that we're
      migrating away from, but should still read from if necessary.
    default:
  old_os_auth_version:
    type: string
    description: >
      OpenStack authentication protocol version for a previous Swift
      instance that we're migrating away from, but should still read from if
      necessary.
    default: "2.0"
  old_os_password:
    type: string
    description: >
      OpenStack password for a previous Swift instance that we're migrating
      away from, but should still read from if necessary.
    default:
  old_os_tenant_name:
    type: string
    description: >
      OpenStack tenant name for a previous Swift instance that we're
      migrating away from, but should still read from if necessary.
    default:
  old_os_username:
    type: string
    description: >
      OpenStack username for a previous Swift instance that we're migrating
      away from, but should still read from if necessary.
    default:
  os_auth_url:
    type: string
    description: OpenStack authentication URL.
    default:
  os_auth_version:
    type: string
    description: OpenStack authentication protocol version.
    default: "2.0"
  os_password:
    type: string
    description: OpenStack password.
    default:
  os_tenant_name:
    type: string
    description: OpenStack tenant name.
    default:
  os_username:
    type: string
    description: OpenStack username.
    default:
  port_download_base:
    type: int
    description: Base port number for public download workers.
    default: 8000
  port_restricted_download_base:
    type: int
    description: Base port number for restricted download workers.
    default: 8005
  port_restricted_upload_base:
    type: int
    description: Base port number for restricted upload workers.
    default: 9095
  port_upload_base:
    type: int
    description: Base port number for public upload workers.
    default: 9090
  frontend_proxy_protocol_enabled:
    type: boolean
    description: >
      Accept PROXY protocol headers from the upstream load balancer and log
      the real client IP.  Enable only when the load balancer is configured
      to send PROXY protocol headers.
    default: false
  use_per_vhost_certificate:
    type: boolean
    description: >
      Whether the restricted librarian vhost uses its own "restricted."
      certificate.  When false, it reuses the main librarian certificate.
    default: false
  ssl_chain_required:
    type: boolean
    description: >
      Whether an intermediate certificate chain is needed for this service.
      In development, we use self-signed certificates which don't have a
      certificate chain; but in real deployments, we need to send a
      certificate chain.
    default: false
  backfill_sha512_workers:
    type: int
    description: Number of parallel download workers for librarian-backfill-sha512.
    default: 2
  swift_feed_workers:
    type: int
    description: Number of librarian-feed-swift workers to run in parallel.
    default: 1
  swift_timeout:
    type: int
    description: Time in seconds to wait for a response from Swift.
    default: 15
  upstream_host:
    type: string
    description: Host name for the upstream librarian, if any.
    default:
  upstream_port:
    type: int
    description: Port for the upstream librarian, if any.
    default: 80
  webmaster_email:
    type: string
    description: Email address to include in Apache virtual host configuration.
    default: "webmaster@launchpad.test"
  workers:
    type: int
    description: >
      Number of librarian worker processes.  If set, each worker will listen
      on consecutive ports starting from each of `port_download_base`,
      `port_restricted_download_base`, `port_restricted_upload_base`, and
      `port_upload_base`, so make sure there is enough space between those.
    default: 1
