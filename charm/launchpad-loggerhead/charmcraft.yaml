type: charm
bases:
  - build-on:
    - name: ubuntu
      channel: "20.04"
      architectures: [amd64]
    run-on:
    - name: ubuntu
      channel: "20.04"
      architectures: [amd64]
parts:
  charm-wheels:
    source: https://git.launchpad.net/~ubuntuone-hackers/ols-charm-deps/+git/wheels
    source-commit: "c6ab756145b816be0819e71a35628c0f5bd3f674"
    source-submodules: []
    source-type: git
    plugin: dump
    organize:
      "*": charm-wheels/
    prime:
      - "-charm-wheels"
  ols-layers:
    source: https://git.launchpad.net/ols-charm-deps
    source-commit: "e0881cbc66acfec6cec25c646ef848e326f47755"
    source-submodules: []
    source-type: git
    plugin: dump
    organize:
      "*": layers/
    stage:
      - layers
    prime:
      - "-layers"
  launchpad-layers:
    after:
      - ols-layers
    source: https://git.launchpad.net/launchpad-layers
    source-commit: "46bf7e80bfe20305206ca29f2c934f1b852c580b"
    source-submodules: []
    source-type: git
    plugin: dump
    organize:
      launchpad-base: layers/layer/launchpad-base
      launchpad-payload: layers/layer/launchpad-payload
    stage:
      - layers
    prime:
      - "-layers"
  layer-coordinator:
    source: https://git.launchpad.net/layer-coordinator
    source-commit: "fa27fc93e0b08000963e83a6bfe49812d890dfcf"
    source-submodules: []
    source-type: git
    plugin: dump
    organize:
      "*": layers/layer/coordinator/
    stage:
      - layers
    prime:
      - "-layers"
  charm:
    after:
      - charm-wheels
      - launchpad-layers
      - layer-coordinator
    source: .
    plugin: reactive
    build-snaps: [charm]
    build-packages: [libpq-dev, python3-dev]
    build-environment:
      - CHARM_LAYERS_DIR: $CRAFT_STAGE/layers/layer
      - CHARM_INTERFACES_DIR: $CRAFT_STAGE/layers/interface
      - PIP_NO_INDEX: "true"
      - PIP_FIND_LINKS: $CRAFT_STAGE/charm-wheels
    reactive-charm-build-arguments: [--binary-wheels-from-source]
