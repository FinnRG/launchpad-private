name: launchpad-copy-archive-publisher
display-name: launchpad-copy-archive-publisher
summary: | 
  Mixed bag of cronjobs, previously used for phone project, nowadays sometimes
  used to publish test rebuilds.
maintainer: Launchpad Developers <launchpad-dev@lists.launchpad.net>
description: |
  Launchpad is an open source suite of tools that help people and teams
  to work together on software projects.
subordinate: true
requires:
  apache-website:
    interface: apache-website
    scope: container

storage:
  data:
    type: filesystem
    location: "/srv/launchpad/data"
    # XXX 2026-07-13 tushar5526: Drop the optional support after the cloud
    # migration.
    multiple:
      range: 0-1
